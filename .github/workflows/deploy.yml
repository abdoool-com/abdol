
name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          BASE_URL: /
          NITRO_PRESET: node

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la .output || true

          echo ""
          echo "=== Public output ==="
          ls -la .output/public || true

      - name: Start Nitro server
        run: |
          PORT=3456 node .output/server/index.mjs > /tmp/nitro.log 2>&1 &
          echo $! > /tmp/nitro.pid

          echo "Waiting for Nitro server..."

          for i in {1..30}; do
            if curl -fsS http://localhost:3456/ > /dev/null 2>&1; then
              echo "Nitro server is ready."
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 1
          done

          echo "Nitro server failed to start."
          echo "=== Nitro logs ==="
          cat /tmp/nitro.log
          exit 1

      - name: Prerender application
        run: |
          echo "Fetching application HTML..."

          mkdir -p .output/public

          curl -fsSL \
            http://localhost:3456/ \
            -o .output/public/index.html

          echo "Creating GitHub Pages fallback..."

          cp .output/public/index.html .output/public/404.html

          echo ""
          echo "=== Generated index.html ==="
          head -30 .output/public/index.html

      - name: Stop Nitro server
        if: always()
        run: |
          if [ -f /tmp/nitro.pid ]; then
            kill "$(cat /tmp/nitro.pid)" 2>/dev/null || true
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

